tier=3
root_mac=brew:pytorch
root_win=testlibs
env_win=CFLAT_TESTLIB_LIBTORCH
probe=include/torch/csrc/api/include/torch/torch.h
include=include include/torch/csrc/api/include
lib_mac=lib/libtorch.dylib lib/libtorch_cpu.dylib lib/libc10.dylib
lib_win=lib/torch.lib lib/torch_cpu.lib lib/c10.lib
runpath_mac=lib
runpath_win=bin
# vcpkg's torch_cpu.dll forks OpenMP regions via VCOMP140 (_vcomp_fork) but asks libomp140 for omp_get_thread_num,
# so every worker sees thread 0 of 1 and parallel kernels race (plain clang++ flakes too: softmax row sum 0.45).
# One thread sidesteps the mixed runtimes; drop this once the port links a single OpenMP.
runenv_win=OMP_NUM_THREADS=1
version_mac=brew list --versions pytorch
hint_mac=brew install pytorch
hint_win=run vcpkg install --triplet x64-windows inside test_libs\torch (its own vcpkg.json, hours), or set CFLAT_TESTLIB_LIBTORCH to an unpacked libtorch distribution
timeout=900
