tier=3
root_mac=brew:pytorch
root_win=testlibs
env_win=CFLAT_TESTLIB_LIBTORCH
probe=include/torch/csrc/api/include/torch/torch.h
include=include include/torch/csrc/api/include
lib_mac=lib/libtorch.dylib lib/libtorch_cpu.dylib lib/libc10.dylib
lib_win=lib/torch.lib lib/torch_cpu.lib lib/c10.lib
runpath_mac=lib
runpath_win=lib
version_mac=brew list --versions pytorch
hint_mac=brew install pytorch
hint_win=install the torch feature of test_libs/vcpkg.json (vcpkg install --x-feature=torch, hours), or set CFLAT_TESTLIB_LIBTORCH to an unpacked libtorch distribution
timeout=900
